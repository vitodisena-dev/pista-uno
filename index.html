<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pista Uno — Simulador de Vuelo (Cessna 172 · MMMD)</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #090d16;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #f8fafc;
      }
      #app {
        position: relative;
        width: 100vw;
        height: 100vh;
      }
      canvas#sim-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #hud-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 16px;
      }
      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
      }
      .badge-panel {
        background: rgba(15, 23, 42, 0.78);
        border: 1px solid rgba(148, 163, 184, 0.28);
        backdrop-filter: blur(8px);
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 13px;
        line-height: 1.45;
      }
      .badge-title {
        font-weight: 700;
        font-size: 14px;
        color: #38bdf8;
        margin-bottom: 2px;
      }
      .telemetry-row {
        display: flex;
        gap: 14px;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="sim-canvas"></canvas>
      <div id="hud-overlay">
        <div class="top-bar">
          <div class="badge-panel">
            <div class="badge-title">✈️ PISTA UNO — Fase 1 (Escena Base & Loop 120 Hz)</div>
            <div>Aeropuerto: <strong>MMMD (Mérida, Yucatán)</strong> · Pista <strong>10/28</strong> (3,200 m × 45 m · 38 ft MSL)</div>
            <div>Aeronave: <strong>Cessna 172S Skyhawk (180 HP)</strong> · Posicionado en Cabecera 10</div>
          </div>
          <div class="badge-panel telemetry-row">
            <div>FPS: <strong id="fps-val">60</strong></div>
            <div>Física: <strong id="hz-val">120 Hz</strong></div>
            <div>Pasos: <strong id="step-val">0</strong></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
